[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-pi-agent"
version = "0.7.0"
description = "A small interactive coding agent powered by DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
]

[project.scripts]
mini-pi = "mini_pi.cli:main"

[tool.setuptools]
py-modules = ["agent", "evaluate"]

[tool.setuptools.packages.find]
include = ["mini_pi*"]
